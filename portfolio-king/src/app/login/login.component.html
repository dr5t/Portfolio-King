<div class="split-login-container">
  <div class="login-branding-side">
    <div class="branding-content">
      <div class="brand-logo-wrap">
        <img src="assets/imgs/logo.svg" alt="Portfolio King" class="crown-logo" width="140" height="140">
      </div>
      <h1 class="brand-title">Portfolio King</h1>
      <p class="brand-subtitle">Financial Strategy Simulation</p>
    </div>

    <div class="bull-bear-illustration-wrap">
      <picture>
        <source srcset="assets/imgs/bull_bear_illustration.webp" type="image/webp">
        <img src="assets/imgs/bull_bear_illustration.png" alt="Market Bull and Bear Illustration" class="bull-bear-img" width="494" height="274" fetchpriority="high">
      </picture>
    </div>
  </div>

  <div class="login-form-side">
    <div class="form-wrapper">
      <div class="form-header">
        <h2 class="welcome-heading">Welcome Back</h2>
        <p class="welcome-sub">Access your game dashboard</p>
      </div>

      <div class="segmented-auth-tabs">
        <button type="button" class="tab-btn" [class.active]="userType === 'Player'" (click)="onSetRole('Player')">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Team Login</span>
          <span class="sr-only">Player Login</span>
        </button>
        <button type="button" class="tab-btn" [class.active]="userType === 'Admin'" (click)="onSetRole('Admin')">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Admin Login</span>
        </button>
      </div>

      <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="auth-form" novalidate>
        <div class="form-group">
          <label class="field-label" for="username-field">
            {{userType === 'Player' ? 'Team ID' : 'Admin Username'}}
          </label>
          <div class="input-icon-wrap">
            <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <circle cx="12" cy="10" r="2.5"></circle>
              <path d="M7 17a5 5 0 0 1 10 0"></path>
            </svg>
            <input id="username-field" type="text" class="input-control" name="username" ngModel 
                   [placeholder]="userType === 'Player' ? 'Enter your Team ID' : 'Enter admin username'"
                   [class.has-error]="submitted && !f.value.username"
                   required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="field-label" for="password-field">Password</label>
          <div class="input-icon-wrap">
            <svg class="leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input id="password-field" [type]="showPassword ? 'text' : 'password'" class="input-control" name="password" ngModel 
                   placeholder="Enter password"
                   [class.has-error]="submitted && !f.value.password"
                   required autocomplete="current-password">
            <button type="button" class="trailing-toggle-btn" (click)="toggleShowPassword()" 
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="checkbox-label">
            <input type="checkbox" name="rememberMe" ngModel class="checkbox-control">
            <span class="checkbox-text">Remember me</span>
          </label>
        </div>

        <div class="submit-wrap">
          <button type="submit" class="btn-login-submit" [disabled]="isLoading">
            <span *ngIf="!isLoading">Login &rarr;</span>
            <span *ngIf="isLoading" class="loading-state">
              <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                <path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/>
              </svg>
              Authenticating...
            </span>
          </button>
        </div>

        <div class="auth-error-alert inline-auth-alert" *ngIf="errorMessage">
          <svg class="alert-icon-svg" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <span class="alert-text">{{errorMessage}}</span>
        </div>
      </form>
    </div>
  </div>
</div>
