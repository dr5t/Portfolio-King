<div class="game-container">
  <div class="board-container">
    <app-team-area *ngFor="let player of game?.players; let i = index" [teamId]="player._id"
                   class="team-{{i+1}} {{player._id === curr_player_id? 'active':''}}"></app-team-area>
    <div class="circle" *ngIf="game">
      <div class="l-half">
        <div class="half-inner"></div>
      </div>
      <div class="r-half">
        <div class="half-inner"></div>
      </div>
      <button class="dice-container {{user.isAdmin==='true'?'admin':''}}" [disabled]="!diceStatus || isSpectator"
              (click)="onDiceClick($event)">
        <span class="wrap">
          <span id="dice1" class="dice dice_1"></span>
        </span>
        <span class="wrap">
          <span id="dice2" class="dice dice_1"></span>
        </span>
        <div class="retry-pill" *ngIf="enableRetry && isRetry">Retry Available</div>
        <div class="spectator-tray-badge" *ngIf="isSpectator">Spectator</div>
      </button>
      <div class="arrow-active t-1 {{game?.players[0]?._id === curr_player_id? 'active':''}}"></div>
      <div class="arrow-active t-2 {{game?.players[1]?._id === curr_player_id? 'active':''}}"></div>
      <div class="arrow-active t-3 {{game?.players[2]?._id === curr_player_id? 'active':''}}"></div>
      <div class="arrow-active t-4 {{game?.players[3]?._id === curr_player_id? 'active':''}}"></div>
    </div>
  </div>

  <div class="score-side-container">
    <div class="session-header-card">
      <div class="session-badge" [class.spectator-badge]="isSpectator">
        <span class="pulse-dot"></span>
        {{isSpectator ? 'Spectator View (Live)' : 'Active Session'}}
      </div>
      <h2 class="fiscal-period-title">
        <span class="fiscal-label">Fiscal Period:</span>
        <span class="fiscal-val tabular-nums">Year {{year}} &middot; Q{{quarter}}</span>
      </h2>
    </div>

    <div class="active-team-view">
      <app-team-details [teamId]="curr_player_id" *ngIf="curr_player_id" [currRound]="curr_round" [currState]="curr_state"
                        [viewStatus]="'game'"></app-team-details>
    </div>

    <div class="admin-controls-card" *ngIf="user.isAdmin && !game_state">
      <button class="btn-resume" (click)="onStateChange('resume-game')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Resume Game
      </button>
    </div>
  </div>
</div>

<div class="session-status-banner" *ngIf="!allowGame && overlayDismissed" role="status" aria-live="polite">
  <div class="status-indicator-dot" [ngClass]="sessionStatusDotClass"></div>
  <span class="status-banner-text">{{sessionStatusText}}</span>
  <button type="button" class="btn-status-reopen" (click)="showOverlay()">View Details</button>
</div>

<div class="wait-msg-container" *ngIf="!allowGame && !overlayDismissed">
  <div class="wait-msg-overlay" (click)="dismissOverlay()"></div>
  <div class="wait-msg" role="dialog" aria-modal="true" [attr.aria-label]="sessionStatusText">
    <button type="button" class="wait-close-btn" (click)="dismissOverlay()" aria-label="Dismiss waiting overlay">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="wait-icon-container">
      <svg *ngIf="sessionState === 'disconnected'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <svg *ngIf="sessionState === 'paused'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
      <svg *ngIf="sessionState !== 'disconnected' && sessionState !== 'paused'" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    <div class="wait-title">{{sessionStatusText}}</div>
    <div class="wait-desc">{{sessionStatusDescription}}</div>
  </div>
</div>

<div class="wait-msg-container" *ngIf="completeMessage">
  <div class="wait-msg-overlay"></div>
  <div class="wait-msg completion-card">
    <div class="wait-icon-container success-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#176B45" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
    </div>
    <div class="wait-title">Round Completed</div>
    <div class="wait-desc">Fiscal quarter completed. All investment decisions evaluated. Transitioning to Portfolio Leaderboard...</div>
  </div>
</div>
