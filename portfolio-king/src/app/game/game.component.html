<div class="game-container">
  <div class="board-container">
    <app-team-area *ngFor="let player of game?.players; let i = index" [teamId]="player._id"
                   class="team-{{i+1}} {{player._id === curr_player_id? 'active':''}}"></app-team-area>
    <div class="circle" *ngIf="game">
      <div class="l-half">
        <div class="half-inner"></div>
      </div>
      <div class="r-half">
        <div class="half-inner"></div>
      </div>
      <button class="dice-container {{user.isAdmin==='true'?'admin':''}}" [disabled]="!diceStatus"
              (click)="onDiceClick($event)">
    <span class="wrap">
      <span id="dice1" class="dice dice_1"></span>
    </span>
        <span class="wrap">
      <span id="dice2" class="dice dice_1"></span>
    </span>
        <div *ngIf="enableRetry && isRetry">Retry</div>
      </button>
      <div class="arrow-active t-1 {{game?.players[0]?._id === curr_player_id? 'active':''}}"></div>
      <div class="arrow-active t-2 {{game?.players[1]?._id === curr_player_id? 'active':''}}"></div>
      <div class="arrow-active t-3 {{game?.players[2]?._id === curr_player_id? 'active':''}}"></div>
      <div class="arrow-active t-4 {{game?.players[3]?._id === curr_player_id? 'active':''}}"></div>
    </div>
  </div>
  <div class="score-side-container">
    <h2>Year: {{year}} Quarter: {{quarter}}</h2>
    <app-team-details [teamId]="curr_player_id" *ngIf="curr_player_id" [currRound]="curr_round" [currState]="curr_state"
                      [viewStatus]="'game'"></app-team-details>
    <!--<button (click)="onStateChange('pause-game')" *ngIf="user.isAdmin && game_state">Pause game</button>-->
    <button (click)="onStateChange('resume-game')" *ngIf="user.isAdmin && !game_state">Resume game</button>
  </div>
</div>
<div class="wait-msg-container" *ngIf="!allowGame">
  <div class="wait-msg-overlay"></div>
  <div class="wait-msg">Please Wait for other players to join and admin access.</div>
</div>

<div class="wait-msg-container" *ngIf="completeMessage">
  <div class="wait-msg-overlay"></div>
  <div class="wait-msg">
    <div>Round Completed</div>
  </div>
</div>
